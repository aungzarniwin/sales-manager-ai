<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Sales Manager V2</title>

<style>
* {
box-sizing: border-box;
}

body {
margin: 0;
font-family: Arial, sans-serif;
background: #f4f6f8;
color: #222;
}

.container {
max-width: 700px;
margin: auto;
padding: 20px;
}

h1 {
text-align: center;
margin-bottom: 25px;
}

.card {
background: white;
padding: 20px;
margin-bottom: 20px;
border-radius: 15px;
box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

h2 {
margin-top: 0;
}

label {
display: block;
margin-top: 12px;
font-weight: bold;
}

input,
textarea {
width: 100%;
padding: 12px;
margin-top: 6px;
border: 1px solid #ccc;
border-radius: 8px;
font-size: 16px;
}

button {
width: 100%;
padding: 13px;
margin-top: 15px;
border: none;
border-radius: 8px;
font-size: 16px;
font-weight: bold;
cursor: pointer;
}

.calculate {
background: #222;
color: white;
}

.ask {
background: #0066ff;
color: white;
}

.result {
margin-top: 20px;
padding: 15px;
background: #f1f3f5;
border-radius: 10px;
line-height: 1.8;
}

.ai-answer {
margin-top: 15px;
padding: 15px;
background: #eef5ff;
border-radius: 10px;
line-height: 1.6;
}
</style>
</head>

<body>

<div class="container">

<h1>🤖 AI Sales Manager V2</h1>

<div class="card">

<h2>🤖 AI Sales Assistant</h2>

<textarea
id="salesQuestion"
rows="4"
placeholder="Ask your sales question...">
</textarea>

<button class="ask" onclick="askAI()">
🤖 Ask AI
</button>

<div id="aiAnswer" class="ai-answer">
AI advice will appear here.
</div>

</div>


<div class="card">

<h2>📊 Sales Performance Calculator</h2>

<label>Monthly Target (MMK)</label>
<input type="number" id="target" placeholder="10000000">

<label>Actual Sales (MMK)</label>
<input type="number" id="actual" placeholder="6500000">

<label>Total Working Days</label>
<input type="number" id="workingDays" placeholder="26">

<label>Days Passed</label>
<input type="number" id="daysPassed" placeholder="16">

<button class="calculate" onclick="calculateSales()">
📊 Calculate
</button>

<div id="salesResult" class="result">
Enter your sales data.
</div>

</div>

</div>


<script>

function calculateSales() {

const target =
Number(document.getElementById("target").value);

const actual =
Number(document.getElementById("actual").value);

const workingDays =
Number(document.getElementById("workingDays").value);

const daysPassed =
Number(document.getElementById("daysPassed").value);

if (
target <= 0 ||
workingDays <= 0 ||
daysPassed <= 0
) {

document.getElementById("salesResult").innerHTML =
"Please enter valid sales data.";

return;
}

const achievement =
(actual / target) * 100;

const remaining =
target - actual;

const remainingDays =
workingDays - daysPassed;

const dailyRequired =
remainingDays > 0
? remaining / remainingDays
: 0;

const dailyAverage =
daysPassed > 0
? actual / daysPassed
: 0;

document.getElementById("salesResult").innerHTML =

"🎯 Achievement: " +
achievement.toFixed(1) +
"%<br>" +

"💰 Remaining Target: " +
remaining.toLocaleString() +
" MMK<br>" +

"📅 Remaining Days: " +
remainingDays +
"<br>" +

"🔥 Daily Required: " +
dailyRequired.toLocaleString(undefined, {
maximumFractionDigits: 0
}) +
" MMK<br>" +

"📈 Daily Average: " +
dailyAverage.toLocaleString(undefined, {
maximumFractionDigits: 0
}) +
" MMK";

}


async function askAI() {

const question =
document.getElementById("salesQuestion").value;

const answerBox =
document.getElementById("aiAnswer");

if (!question.trim()) {

answerBox.innerHTML =
"Please enter your sales question.";

return;

}

answerBox.innerHTML =
"🤖 AI is thinking...";

try {

const response = await fetch(
"https://ai-sales-manager.agzarniwin.workers.dev",
{
method: "POST",

headers: {
"Content-Type": "application/json"
},

body: JSON.stringify({
question: question
})

}
);

const data =
await response.json();

if (data.answer) {

answerBox.innerHTML =
data.answer;

} else {

answerBox.innerHTML =
"❌ AI could not answer.";

}

}

catch (error) {

answerBox.innerHTML =
"❌ Connection error.";

}

}

</script>

</body>
</html>
